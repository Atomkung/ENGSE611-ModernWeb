<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grade-check</title>
</head>
<body>
    <button onclick="runCode()">Run Code</button>
    <div id="outputBox" style="background-color: black; border-radius: 10px; color: white; white-space: pre-line;">แสดงผลตรงนี้</div>
    <script>
    function runCode(){
        const output = [];

        let score = 62;
        output.push("คะแนนที่ได้:" + score);
        console.log("คะแนนที่ได้:", score);
        //ตรวจสอบเกรด
        if(score >= 80){
            output.push("เกรด: A");
            console.log("เกรด: A");
        }else if(score >= 70){
            output.push("เกรด: B");
            console.log("เกรด: B");
        }else if(score >= 60){
            output.push("เกรด: C");
            console.log("เกรด: C");
        }else if(score >= 50){
            output.push("เกรด: D");
            console.log("เกรด: D");
        }else{
            output.push("เกรด: F");
            console.log("เกรด: F")
        }


        //ตรวจสอบว่า ผ่านหรือไม่ผ่าน
        if (score >= 50){
            output.push("ผลสอบ: ผ่าน");
            console.log("ผลสอบ: ผ่าน");
        } else {
            output.push("ผลสอบ: ไม่ผ่าน");
            console.log("ผลสอบ: ไม่ผ่าน");
        }


        
        document.getElementById("outputBox").textContent = output.join("\n");
    }
    </script>
</body>
</html>

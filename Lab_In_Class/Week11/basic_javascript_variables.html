<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript_variables</title>
</head>
<body>
    <button onclick="runDemo()">Run Code</button>
    <script>
        function runDemo(){
            //ล้าง console ทุกครั้งที่รัน เพื่อไม่ให้สับสนกับผลเก่า
            console.clear();
            const output = [];

            //ตัวอย่างตัวแปร
            let studentName = 'สมชาย';
            let age = 20;
            let isStudent = true;
            const universityName = 'มหาวิทยาลัยเทคโนโลยี'
            //แสดงตัวแปรเริ่มต้น
            output.push("ชื่อ: " + studentName);
            console.log("ชื่อ:", studentName);
            output.push("อายุ: " + age);
            console.log("อายุ:", age);

            //เปลื่ยนค่า let
            age = 21;
            output.push("อายุใหม่: " + age);
            console.log("อายุใหม่:", age);
            //เปลื่ยนค่า const (จะ error แต่ถูกจับใน catch)
            try {
                universityName = 'มหาวิทยาลัยเชียงใหม่'; //ทำให้เกิด typeError
            } catch (e){
                output.push("error: " + e.message);
                console.error(e.message); //แสดงในconsole เป็นสีแดง
            }

            //แสดงผลบนหน้าเว็บ
            document.getElementById("OutputBox").textContent = output.join("\n");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatypes</title>
</head>
<body>
    <script>
        let aString = 'สวัดดี';   console.log('Type of aString:', typeof aString);
        let aNumber = 99.5;     console.log('Type of aNumber:', typeof aNumber);
        let aBoolean = true;    console.log('Type of aBoolean:', typeof aBoolean);
        let anUndefined;        console.log('Type of anUndefined:', typeof anUdefined);
        let aNull = null;       console.log('Type of aNull', typeof aNull);
    </script>
</body>
</html>
